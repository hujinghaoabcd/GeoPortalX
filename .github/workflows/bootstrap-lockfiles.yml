name: Bootstrap lockfiles

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  generate-lockfiles:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Check whether lockfiles are missing
        id: check
        run: |
          if [[ -f backend/uv.lock && -f frontend/pnpm-lock.yaml ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.check.outputs.required == 'true'
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.required == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.check.outputs.required == 'true'
        with:
          node-version: 22
      - name: Generate lockfiles
        if: steps.check.outputs.required == 'true'
        run: |
          cd backend
          uv lock
          cd ../frontend
          pnpm install --lockfile-only
      - name: Commit lockfiles
        if: steps.check.outputs.required == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock frontend/pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add reproducible dependency lockfiles"
          git push origin HEAD:${{ github.head_ref }}
