name: Raster integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  raster-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UV_NO_PROGRESS: "1"
      DJANGO_SETTINGS_MODULE: geoportalx.settings.inspection_integration
      RUN_RASTER_COG_INTEGRATION: "1"
      RASTER_COG_TIMEOUT: "600"
      RASTER_COG_MAX_BYTES: "1073741824"
      RASTER_STATISTICS_MAX_SIZE: "512"
      RASTER_TILE_MIN_ZOOM: "0"
      RASTER_TILE_MAX_ZOOM: "22"
      TITILER_TEST_URL: http://127.0.0.1
      TITILER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TITILER_TEST_BUCKET: geoportalx-titiler
      S3_ACCESS_KEY: geoportalx
      S3_SECRET_KEY: change-me-now
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GDAL system tools
        timeout-minutes: 6
        run: |
          set -euo pipefail
          if command -v gdal_translate >/dev/null 2>&1; then
            gdal_translate --version
            exit 0
          fi
          sudo timeout 120s apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20
          sudo timeout 180s apt-get install \
            --yes \
            --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev
          gdal_translate --version
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install raster dependencies
        run: |
          uv sync --locked \
            --extra dev \
            --extra geo \
            --no-install-package gdal \
            --no-install-package geopandas \
            --no-install-package pycsw \
            --no-install-project
      - name: Convert a real GeoTIFF into a COG
        run: |
          set +e
          uv run --no-sync pytest -vv tests/test_raster_cog_conversion.py \
            2>&1 | tee raster-cog-integration.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Start MinIO
        run: |
          docker run --detach --name geoportalx-raster-minio \
            --network host \
            --env MINIO_ROOT_USER=geoportalx \
            --env MINIO_ROOT_PASSWORD=change-me-now \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --console-address :9001
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs geoportalx-raster-minio
          exit 1
      - name: Publish integration COG to MinIO
        run: uv run --no-sync python tests/titiler_integration.py setup
      - name: Start internal TiTiler
        run: |
          docker run --detach --name geoportalx-titiler \
            --network host \
            --env AWS_ACCESS_KEY_ID=geoportalx \
            --env AWS_SECRET_ACCESS_KEY=change-me-now \
            --env AWS_REGION=us-east-1 \
            --env AWS_S3_ENDPOINT=127.0.0.1:9000 \
            --env AWS_HTTPS=NO \
            --env AWS_VIRTUAL_HOSTING=FALSE \
            --env GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR \
            --env CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.tiff,.TIF,.TIFF \
            ghcr.io/developmentseed/titiler:2.0.2
      - name: Verify TiTiler info, PNG tile, and point query
        run: |
          set +e
          uv run --no-sync python tests/titiler_integration.py check \
            2>&1 | tee titiler-integration.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Capture container logs on failure
        if: failure()
        run: |
          docker logs geoportalx-raster-minio 2>&1 | tee minio-raster.log || true
          docker logs geoportalx-titiler 2>&1 | tee titiler-container.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: raster-integration-failure-log
          path: |
            backend/raster-cog-integration.log
            backend/titiler-integration.log
            backend/minio-raster.log
            backend/titiler-container.log
