name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UV_NO_PROGRESS: "1"
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgis://geoportalx:geoportalx@localhost:5432/geoportalx_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev --no-install-project
      - name: Lint backend
        run: |
          set +e
          uv run ruff check . --output-format=concise 2>&1 | tee ruff.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-ruff-failure-log
          path: backend/ruff.log
      - run: uv run python -m compileall geoportalx modules tests

  backend-test:
    needs: backend-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: geoportalx_test
          POSTGRES_USER: geoportalx
          POSTGRES_PASSWORD: geoportalx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geoportalx -d geoportalx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      UV_NO_PROGRESS: "1"
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgis://geoportalx:geoportalx@localhost:5432/geoportalx_test
    steps:
      - uses: actions/checkout@v4
      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev --no-install-project
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Test backend against PostGIS
        run: |
          set +e
          uv run pytest -vv 2>&1 | tee backend-test.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-failure-log
          path: backend/backend-test.log

  storage-integration:
    needs: backend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UV_NO_PROGRESS: "1"
      DJANGO_SETTINGS_MODULE: geoportalx.settings.storage_integration
      RUN_STORAGE_INTEGRATION: "1"
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: geoportalx
      S3_SECRET_KEY: change-me-now
      S3_BUCKET: geoportalx-integration
      S3_REGION: us-east-1
      S3_ADDRESSING_STYLE: path
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev --no-install-project
      - name: Start MinIO test service
        run: |
          docker run --detach --name geoportalx-minio \
            --publish 9000:9000 --publish 9001:9001 \
            --env MINIO_ROOT_USER=geoportalx \
            --env MINIO_ROOT_PASSWORD=change-me-now \
            --env MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:5173 \
            --env MINIO_API_STALE_UPLOADS_EXPIRY=48h \
            --env MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL=1h \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --console-address :9001
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs geoportalx-minio
          exit 1
      - name: Test real MinIO multipart flow
        run: |
          set +e
          uv run pytest -vv tests/test_minio_integration.py 2>&1 | tee storage-integration.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storage-integration-failure-log
          path: backend/storage-integration.log
      - name: Show MinIO logs on failure
        if: failure()
        run: docker logs geoportalx-minio

  dataset-inspection:
    needs: backend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UV_NO_PROGRESS: "1"
      DJANGO_SETTINGS_MODULE: geoportalx.settings.inspection_integration
      RUN_DATASET_INSPECTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install inspection dependencies
        run: |
          uv sync --locked \
            --extra dev \
            --extra geo \
            --no-install-package gdal \
            --no-install-package geopandas \
            --no-install-package pycsw \
            --no-install-project
      - name: Test real vector and raster files
        run: |
          set +e
          uv run --no-sync pytest -vv tests/test_dataset_inspection_files.py 2>&1 | tee dataset-inspection.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dataset-inspection-failure-log
          path: backend/dataset-inspection.log

  martin-integration:
    needs: backend-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: geoportalx_martin
          POSTGRES_USER: geoportalx
          POSTGRES_PASSWORD: geoportalx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geoportalx -d geoportalx_martin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      UV_NO_PROGRESS: "1"
      MARTIN_TEST_DATABASE_URL: postgresql://geoportalx:geoportalx@127.0.0.1:5432/geoportalx_martin
      MARTIN_TEST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev --no-install-project
      - name: Create Martin integration table
        run: uv run python tests/martin_integration.py setup
      - name: Start internal Martin service
        run: |
          docker run --detach --name geoportalx-martin \
            --network host \
            --env DATABASE_URL="$MARTIN_TEST_DATABASE_URL" \
            --volume "$GITHUB_WORKSPACE/deploy/martin.yaml:/config/martin.yaml:ro" \
            ghcr.io/maplibre/martin:1.11.0 \
            --config /config/martin.yaml
      - name: Verify Martin TileJSON and MVT
        run: |
          set +e
          uv run python tests/martin_integration.py check 2>&1 | tee martin-integration.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Capture Martin logs on failure
        if: failure()
        run: docker logs geoportalx-martin 2>&1 | tee martin-container.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: martin-integration-failure-log
          path: |
            backend/martin-integration.log
            backend/martin-container.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
