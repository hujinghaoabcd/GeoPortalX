name: geoportalx

services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: geoportalx
      POSTGRES_USER: geoportalx
      POSTGRES_PASSWORD: geoportalx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoportalx -d geoportalx"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgis_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geoportalx
      MINIO_ROOT_PASSWORD: change-me-now
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      MINIO_API_STALE_UPLOADS_EXPIRY: 48h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  storage-init:
    build:
      context: ../backend
    command: python manage.py ensure_storage
    env_file:
      - ../.env
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      MARTIN_INTERNAL_URL: http://martin:3000
      TITILER_INTERNAL_URL: http://titiler:8000
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  worker:
    build:
      context: ../backend
    command: celery -A geoportalx worker -l INFO -Q import,vector,raster,processing,catalog,system
    env_file:
      - ../.env
    environment:
      MARTIN_INTERNAL_URL: http://martin:3000
      TITILER_INTERNAL_URL: http://titiler:8000
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ../backend:/app

  scheduler:
    build:
      context: ../backend
    command: celery -A geoportalx beat -l INFO
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  martin:
    image: ghcr.io/maplibre/martin:1.11.0
    command: ["--config", "/config/martin.yaml"]
    environment:
      DATABASE_URL: postgresql://geoportalx:geoportalx@postgis:5432/geoportalx
    depends_on:
      postgis:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./martin.yaml:/config/martin.yaml:ro

  titiler:
    image: ghcr.io/developmentseed/titiler:2.0.2
    environment:
      AWS_ACCESS_KEY_ID: geoportalx
      AWS_SECRET_ACCESS_KEY: change-me-now
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      GDAL_CACHEMAX: "256"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_INGESTED_BYTES_AT_OPEN: "32768"
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      GDAL_HTTP_MULTIPLEX: "YES"
      GDAL_HTTP_VERSION: "2"
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "536870912"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff,.TIF,.TIFF
      RIO_TILER_MAX_THREADS: "4"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgis_data:
  redis_data:
  minio_data:
  frontend_node_modules:
